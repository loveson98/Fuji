<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#09090B">
    <title>Listening - Fuji Learn</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=18.0">
    <script>
        (function() {
            const saved = localStorage.getItem('fuji_theme');
            const theme = saved ? JSON.parse(saved) : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        .sub-header { position: relative !important; top: auto !important; display: flex; align-items: center; justify-content: space-between; padding: var(--space-md) var(--space-lg); padding-top: calc(var(--space-md) + var(--safe-top)); background: var(--bg-primary); border-bottom: 1px solid var(--border-subtle); }
        .sub-header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.02em; flex: 1; text-align: center; margin: 0; }
        .back-btn { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; color: var(--text-primary); transition: background 0.2s ease; text-decoration: none; cursor: pointer; border: none; background: none; }
        .back-btn:active { background: var(--bg-tertiary); }
        .header-spacer { width: 40px; }
        .app-main { padding: 0 16px calc(var(--space-lg) + var(--safe-bottom)) 16px; }

        .segmented-control { display: flex; background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-full); padding: 4px; margin-bottom: var(--space-lg); }
        .seg-btn { flex: 1; padding: 10px 0; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); border: none; background: none; cursor: pointer; transition: all 0.2s ease; }
        .seg-btn.active { background: var(--bg-tertiary); color: var(--text-primary); box-shadow: var(--shadow-sm); }

        .listening-list { display: flex; flex-direction: column; gap: 16px; }
        .listening-card { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 20px; cursor: pointer; transition: transform 0.2s ease; touch-action: manipulation; }
        .listening-card:active { transform: scale(0.98); }
        .listening-title { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
        .listening-sub { font-size: 0.85rem; color: var(--text-secondary); }

        .screen { display: none; }
        .screen.active { display: block; }
        .level-content { display: none; }
        .level-content.active { display: block; }

        /* Quiz Screen Styles */
        .quiz-header { margin-bottom: 24px; }
        .quiz-title { font-size: 1.4rem; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; }
        .quiz-subtitle { font-size: 0.9rem; color: var(--text-secondary); }

        .exercise-card { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }
        .exercise-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        
        /* Smart Play Button */
        .mini-play-btn { width: 44px; height: 44px; background: var(--accent-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; border: none; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0; }
        .mini-play-btn:active { transform: scale(0.9); }
        .mini-play-btn.playing { background: var(--accent-success); animation: pulse 1.5s infinite; }
        .mini-play-btn svg { width: 20px; height: 20px; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .exercise-number { font-size: 0.8rem; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; }
        .exercise-question { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); line-height: 1.4; font-family: var(--font-jp); }

        /* Image UI (Hidden by default if no image in JSON) */
        .exercise-image {
            width: 100%;
            max-height: 220px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
        }

        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { width: 100%; padding: 14px 16px; background: var(--bg-tertiary); border: 2px solid transparent; border-radius: var(--radius-md); font-size: 1.1rem; font-weight: 600; color: var(--text-primary); cursor: pointer; text-align: center; transition: all 0.2s ease; font-family: var(--font-jp); }
        .option-btn:active { transform: scale(0.98); }
        .option-btn.selected { border-color: var(--accent-primary); background: rgba(129, 140, 248, 0.1); color: var(--accent-primary); }
        
        .submit-btn { width: 100%; padding: 18px; background: var(--accent-primary); color: white; border: none; border-radius: var(--radius-lg); font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-top: 24px; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s ease; }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Results Screen Styles */
        .results-container { display: flex; flex-direction: column; gap: 20px; }
        .score-card { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 32px; text-align: center; }
        .score-circle { width: 120px; height: 120px; margin: 0 auto 20px auto; position: relative; }
        .score-circle svg { transform: rotate(-90deg); }
        .score-circle circle { fill: none; stroke-width: 8; }
        .score-circle .bg { stroke: var(--bg-tertiary); }
        .score-circle .progress { stroke: var(--accent-primary); stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
        .score-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.75rem; font-weight: 800; color: var(--text-primary); }
        
        .linear-bar-container { width: 100%; height: 8px; background: var(--bg-tertiary); border-radius: 4px; overflow: hidden; margin: 16px 0; }
        .linear-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-primary), #6366f1); width: 0%; transition: width 1s ease; border-radius: 4px; }
        
        .score-label { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        .score-detail { font-size: 0.95rem; color: var(--text-secondary); }
        
        .review-section { margin-top: 10px; }
        .review-header { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--border-subtle); }
        
        .review-item { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 16px; margin-bottom: 12px; }
        .review-item.is-correct { border-left: 4px solid var(--accent-success); }
        .review-item.is-wrong { border-left: 4px solid var(--accent-error); }
        
        .review-q { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; font-family: var(--font-jp); line-height: 1.4; }
        
        .review-ans-row { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; margin-bottom: 6px; }
        .review-ans-row.user-choice { color: var(--text-secondary); }
        .review-ans-row.correct-choice { color: var(--accent-success); font-weight: 600; }
        
        .status-icon { font-size: 1.1rem; }
        
        .play-btn-secondary { width: 100%; padding: 16px; background: var(--bg-tertiary); color: var(--text-primary); border: none; border-radius: var(--radius-lg); font-size: 1rem; font-weight: 700; cursor: pointer; touch-action: manipulation; margin-top: 10px; }
        .play-btn-secondary:active { opacity: 0.9; }
        
        .loading { text-align: center; padding: 40px; color: var(--text-tertiary); }
    </style>
</head>
<body>
    <div class="app-container animate-fade-in">
        <header class="sub-header">
            <button class="back-btn" onclick="goBack()" aria-label="Go back">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <h1 id="header-title">Listening N5</h1>
            <div class="header-spacer"></div>
        </header>
        
        <main class="app-main">
            <div class="segmented-control" id="level-toggle">
                <button class="seg-btn active" onclick="switchLevel('n5', this)">N5</button>
                <button class="seg-btn" onclick="switchLevel('n4', this)">N4</button>
            </div>

            <!-- Screen 1: List -->
            <div id="screen-list" class="screen active">
                <div id="level-n5" class="level-content active">
                    <div id="listening-list-n5" class="listening-list"><div class="loading">Loading listening sets...</div></div>
                </div>
                <!-- UPDATED: Real N4 list container (no more Coming Soon) -->
                <div id="level-n4" class="level-content">
                    <div id="listening-list-n4" class="listening-list"><div class="loading">Loading listening sets...</div></div>
                </div>
            </div>
            
            <!-- Screen 2: Quiz -->
            <div id="screen-quiz" class="screen">
                <div class="quiz-header">
                    <h2 class="quiz-title" id="quiz-title">Set Title</h2>
                    <p class="quiz-subtitle" id="quiz-subtitle">Listen and answer all questions</p>
                </div>
                <div id="exercises-container"></div>
                <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" disabled>Submit Answers</button>
            </div>
            
            <!-- Screen 3: Results -->
            <div id="screen-results" class="screen">
                <div class="results-container">
                    <div class="score-card">
                        <div class="score-circle">
                            <svg width="120" height="120">
                                <circle class="bg" cx="60" cy="60" r="50"></circle>
                                <circle class="progress" id="score-circle" cx="60" cy="60" r="50" stroke-dasharray="314" stroke-dashoffset="314"></circle>
                            </svg>
                            <div class="score-text" id="score-percent">0%</div>
                        </div>
                        <div class="linear-bar-container">
                            <div class="linear-bar-fill" id="linear-bar"></div>
                        </div>
                        <div class="score-label" id="score-label">Great Job!</div>
                        <div class="score-detail" id="score-detail">0 / 0 correct</div>
                    </div>

                    <div class="review-section">
                        <div class="review-header">Answer Review</div>
                        <div id="review-container"></div>
                    </div>

                    <button class="play-btn-secondary" onclick="backToList()">Back to List</button>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js?v=18.0"></script>
    <script>
        let currentLevel = 'n5';
        let currentSet = null;
        let userAnswers = {};
        let screenHistory = [];
        let currentAudio = null;
        let currentPlayingBtn = null;
        const dataCache = {}; // caches each level so we only fetch once

        // Loads a level's JSON (cached) and renders its list
        async function loadLevel(level) {
            const list = document.getElementById(`listening-list-${level}`);
            if (dataCache[level]) { renderList(level, dataCache[level]); return; }
            list.innerHTML = '<div class="loading">Loading listening sets...</div>';
            try {
                const res = await fetch(`listening_${level}.json?v=18.0`);
                const data = await res.json();
                dataCache[level] = data;
                renderList(level, data);
            } catch (e) {
                list.innerHTML = `<div class="loading" style="color: var(--accent-error)">Error loading listening_${level}.json</div>`;
                console.error(e);
            }
        }

        function renderList(level, data) {
            const list = document.getElementById(`listening-list-${level}`);
            list.innerHTML = '';
            if (!data || data.length === 0) {
                list.innerHTML = '<div class="loading">No listening sets available yet.</div>';
                return;
            }
            data.forEach(set => {
                const card = document.createElement('div');
                card.className = 'listening-card';
                card.onclick = () => startQuiz(set);
                card.innerHTML = `
                    <div class="listening-title">${set.title}</div>
                    <div class="listening-sub">${set.exercises.length} questions</div>
                `;
                list.appendChild(card);
            });
        }

        function startQuiz(set) {
            currentSet = set;
            userAnswers = {};
            screenHistory.push('screen-list');
            
            document.getElementById('header-title').textContent = set.title;
            document.getElementById('level-toggle').style.display = 'none';
            document.getElementById('quiz-title').textContent = set.title;
            document.getElementById('quiz-subtitle').textContent = `${set.exercises.length} questions • Listen carefully`;
            
            renderExercises();
            switchScreen('screen-quiz');
        }

        function renderExercises() {
            const container = document.getElementById('exercises-container');
            container.innerHTML = '';
            document.getElementById('submit-btn').disabled = true;

            currentSet.exercises.forEach((ex, idx) => {
                const card = document.createElement('div');
                card.className = 'exercise-card';
                
                const imageHTML = ex.imageFile ? `<img src="${ex.imageFile}" class="exercise-image" alt="Question Image">` : '';
                
                let optionsHTML = '';
                ex.options.forEach((opt, optIdx) => {
                    optionsHTML += `<button class="option-btn" onclick="selectOption(${idx}, ${optIdx}, this)">${opt}</button>`;
                });

                card.innerHTML = `
                    ${imageHTML}
                    <div class="exercise-header">
                        <button class="mini-play-btn" id="play-btn-${idx}" onclick="toggleAudio(${idx})">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <div>
                            <div class="exercise-number">Question ${idx + 1}</div>
                            <div class="exercise-question">${ex.question}</div>
                        </div>
                    </div>
                    <div class="options-list" id="options-${idx}">
                        ${optionsHTML}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleAudio(idx) {
            const ex = currentSet.exercises[idx];
            const btn = document.getElementById(`play-btn-${idx}`);

            if (currentAudio && currentPlayingBtn === btn && !currentAudio.paused) {
                currentAudio.pause();
                btn.classList.remove('playing');
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
                return;
            }

            if (currentAudio && currentPlayingBtn === btn && currentAudio.paused) {
                currentAudio.play();
                btn.classList.add('playing');
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
                return;
            }

            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                if (currentPlayingBtn) {
                    currentPlayingBtn.classList.remove('playing');
                    currentPlayingBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
                }
            }

            currentAudio = new Audio(ex.audioFile);
            currentPlayingBtn = btn;
            btn.classList.add('playing');
            btn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

            currentAudio.play().catch(e => console.error(e));

            currentAudio.onended = () => {
                btn.classList.remove('playing');
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
                currentPlayingBtn = null;
            };
        }

        function selectOption(qIdx, optIdx, btnElement) {
            userAnswers[qIdx] = optIdx;
            const options = document.querySelectorAll(`#options-${qIdx} .option-btn`);
            options.forEach(btn => btn.classList.remove('selected'));
            btnElement.classList.add('selected');
            
            if (Object.keys(userAnswers).length === currentSet.exercises.length) {
                document.getElementById('submit-btn').disabled = false;
            }
        }

        function submitQuiz() {
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            if (currentPlayingBtn) { currentPlayingBtn.classList.remove('playing'); currentPlayingBtn = null; }

            screenHistory.push('screen-quiz');
            
            let correct = 0;
            let reviewHTML = '';

            currentSet.exercises.forEach((ex, idx) => {
                const selected = userAnswers[idx];
                
                // FIXED: Adding 1 to selected to correctly match the 1-based JSON 'correct' value
                const isCorrect = (selected + 1) === ex.correct; 
                if (isCorrect) correct++;

                const statusClass = isCorrect ? 'is-correct' : 'is-wrong';
                const userText = ex.options[selected] || 'No answer';
                
                // FIXED: Subtracting 1 from ex.correct to get the correct 0-based option index
                const correctText = ex.options[ex.correct - 1]; 
                
                reviewHTML += `
                    <div class="review-item ${statusClass}">
                        <div class="review-q">${idx + 1}. ${ex.question}</div>
                        <div class="review-ans-row user-choice">
                            <span class="status-icon">${isCorrect ? '✅' : '❌'}</span>
                            <span>You chose: ${userText}</span>
                        </div>
                        ${!isCorrect ? `
                            <div class="review-ans-row correct-choice">
                                <span class="status-icon">✓</span>
                                <span>Correct: ${correctText}</span>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            
            const total = currentSet.exercises.length;
            const percent = Math.round((correct / total) * 100);
            
            const circle = document.getElementById('score-circle');
            const circumference = 2 * Math.PI * 50;
            const offset = circumference - (percent / 100) * circumference;
            setTimeout(() => { 
                circle.style.strokeDashoffset = offset; 
                document.getElementById('linear-bar').style.width = `${percent}%`;
            }, 100);
            
            document.getElementById('score-percent').textContent = `${percent}%`;
            document.getElementById('score-detail').textContent = `${correct} / ${total} correct`;
            
            let label = 'Keep Practicing!';
            if (percent === 100) label = 'Perfect Score!';
            else if (percent >= 80) label = 'Great Job!';
            else if (percent >= 60) label = 'Good Work!';
            document.getElementById('score-label').textContent = label;
            
            document.getElementById('review-container').innerHTML = reviewHTML;
            document.getElementById('submit-btn').style.display = 'none';
            switchScreen('screen-results');
        }

        function goBack() {
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            if (currentPlayingBtn) { currentPlayingBtn.classList.remove('playing'); currentPlayingBtn = null; }
            
            if (screenHistory.length > 0) {
                const prevScreen = screenHistory.pop();
                if (prevScreen === 'screen-list') {
                    // FIXED: header now reflects the current level, not hardcoded N5
                    document.getElementById('header-title').textContent = `Listening ${currentLevel.toUpperCase()}`;
                    document.getElementById('level-toggle').style.display = 'flex';
                    document.getElementById('submit-btn').style.display = 'block';
                }
                switchScreen(prevScreen);
            } else {
                window.history.back();
            }
        }

        function backToList() {
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            screenHistory = [];
            // FIXED: header now reflects the current level
            document.getElementById('header-title').textContent = `Listening ${currentLevel.toUpperCase()}`;
            document.getElementById('level-toggle').style.display = 'flex';
            document.getElementById('submit-btn').style.display = 'block';
            switchScreen('screen-list');
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0, 0);
        }
        
        // UPDATED: now actually loads the selected level's data + updates header
        function switchLevel(level, btnElement) {
            currentLevel = level;
            document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            document.querySelectorAll('.level-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`level-${level}`).classList.add('active');
            document.getElementById('header-title').textContent = `Listening ${level.toUpperCase()}`;
            loadLevel(level);
        }

        // Initial load
        loadLevel('n5');
    </script>
</body>
</html>
