<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#09090B">
    <title>Flashcard Player - Fuji Learn</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=19.0">
    <script>
        (function() {
            const saved = localStorage.getItem('fuji_theme');
            const theme = saved ? JSON.parse(saved) : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        .sub-header { position: relative !important; top: auto !important; display: flex; align-items: center; gap: 12px; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); background: var(--bg-primary); border-bottom: 1px solid var(--border-subtle); }
        .sub-header .back-btn { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; color: var(--text-primary); transition: background 0.2s ease; border: none; background: var(--bg-tertiary); cursor: pointer; }
        .sub-header .back-btn:active { background: var(--border-subtle); transform: scale(0.95); }
        .header-center { flex: 1; text-align: center; min-width: 0; }
        .deck-label { font-size: 0.65rem; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; margin-bottom: 2px; }
        .sub-header h1 { font-size: 0.95rem; font-weight: 700; margin: 0; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .progress-counter { font-size: 0.8rem; color: var(--text-secondary); font-weight: 700; font-variant-numeric: tabular-nums; }

        .app-main { padding: 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; height: calc(100vh - 60px); }

        /* Setup Screen */
        #setup-screen { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; }
        .setup-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; color: var(--text-primary); }
        .setup-sub { font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 32px; }
        .setup-btn { width: 100%; max-width: 300px; padding: 16px; margin-bottom: 12px; border-radius: 16px; border: 1px solid var(--border-subtle); background: var(--bg-secondary); color: var(--text-primary); font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s ease; }
        .setup-btn:active { transform: scale(0.97); background: var(--bg-tertiary); }
        .setup-btn.primary { background: var(--accent-primary); color: white; border-color: var(--accent-primary); }

        /* Player Screen */
        #player-screen { display: none; flex-direction: column; flex: 1; }
        
        /* Professional Card Design — compact 3:4 */
        .card-container { flex: 1; display: flex; align-items: center; justify-content: center; perspective: 1000px; margin-bottom: 16px; }
        .card { width: 100%; max-width: 290px; aspect-ratio: 3/4; position: relative; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; cursor: pointer; }
        .card.flipped { transform: rotateY(180deg); }
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 20px; border: 1px solid var(--border-subtle); display: flex; flex-direction: column; overflow: hidden; }
        .card-back { transform: rotateY(180deg); }

        /* Front Face */
        .card-front { align-items: center; justify-content: center; padding: 20px; text-align: center; background: linear-gradient(160deg, rgba(129,140,248,0.08) 0%, var(--bg-secondary) 40%, rgba(167,139,250,0.04) 100%); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.3), inset 0 2.5px 0 0 rgba(129,140,248,0.45); }
        .card-type-badge { position: absolute; top: 16px; right: 16px; font-size: 0.6rem; font-weight: 700; color: var(--accent-primary); background: rgba(129,140,248,0.12); padding: 3px 9px; border-radius: 16px; text-transform: uppercase; letter-spacing: 0.05em; }
        .card-word { font-size: clamp(2rem, 6vw, 3rem); font-weight: 800; font-family: var(--font-jp, sans-serif); color: var(--text-primary); line-height: 1.2; margin-bottom: 10px; }
        .flip-hint { position: absolute; bottom: 18px; font-size: 0.7rem; color: var(--text-tertiary); display: flex; align-items: center; gap: 5px; }

        /* Back Face */
        .card-back { padding: 18px; justify-content: flex-start; overflow-y: auto; background: linear-gradient(180deg, rgba(129,140,248,0.06) 0%, var(--bg-secondary) 25%); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.3), inset 0 -2.5px 0 0 rgba(129,140,248,0.3); }
        .back-section { margin-bottom: 16px; }
        .back-label { font-size: 0.65rem; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
        
        .readings-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .reading-pill { background: var(--bg-tertiary); padding: 5px 10px; border-radius: 7px; font-size: 0.9rem; color: var(--accent-primary); font-family: var(--font-jp, sans-serif); font-weight: 600; }
        .reading-pill span { color: var(--text-tertiary); font-size: 0.65rem; margin-right: 3px; text-transform: uppercase; font-weight: 700; }

        .meaning-en { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 3px; }
        .meaning-np { font-size: 0.9rem; color: var(--accent-primary); font-weight: 600; }

        .example-box { background: var(--bg-tertiary); border-radius: 10px; padding: 12px; border-left: 3px solid var(--accent-primary); position: relative; }
        .example-jp { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); font-family: var(--font-jp, sans-serif); margin-bottom: 5px; padding-right: 28px; line-height: 1.5; }
        .example-en { font-size: 0.8rem; color: var(--text-secondary); font-style: italic; margin-bottom: 3px; }
        .example-np { font-size: 0.75rem; color: var(--accent-primary); }
        .audio-btn { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; background: var(--accent-primary); border-radius: 50%; border: none; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .audio-btn:active { transform: scale(0.9); }
        .audio-btn svg { width: 13px; height: 13px; }

        /* Controls */
        .controls { display: flex; gap: 12px; align-items: center; justify-content: center; padding-top: 8px; }
        .ctrl-btn { padding: 14px 24px; border-radius: 14px; border: none; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 8px; }
        .ctrl-btn:active { transform: scale(0.96); }
        .btn-prev { background: var(--bg-tertiary); color: var(--text-primary); }
        .btn-next { background: var(--accent-primary); color: white; flex: 1; max-width: 200px; justify-content: center; }
        .btn-prev:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Complete Screen */
        #complete-screen { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; }
        .complete-icon { width: 80px; height: 80px; background: linear-gradient(135deg, var(--accent-primary), #a78bfa); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; color: white; }
        .complete-icon svg { width: 40px; height: 40px; }
        .complete-title { font-size: 1.5rem; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; }
        .complete-sub { font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 32px; max-width: 280px; }

        .loading { text-align: center; padding: 60px 20px; color: var(--text-tertiary); font-size: 0.95rem; flex: 1; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="app-container animate-fade-in">
        <header class="sub-header">
            <button class="back-btn" onclick="window.history.back()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <div class="header-center">
                <div class="deck-label" id="deck-label">Flashcards</div>
                <h1 id="deck-title">Loading...</h1>
            </div>
            <div class="progress-counter" id="progress-counter"></div>
        </header>

        <main class="app-main">
            <div id="loading-screen" class="loading">Loading deck data...</div>

            <!-- 1. Setup Screen -->
            <div id="setup-screen">
                <div class="setup-title">How would you like to study?</div>
                <div class="setup-sub">Choose your learning style for this session.</div>
                <button class="setup-btn" onclick="startDeck('shuffle')">
                    <span>🔀</span> Shuffle Cards
                </button>
                <button class="setup-btn primary" onclick="startDeck('sequential')">
                    <span>📚</span> Sequential Order
                </button>
            </div>

            <!-- 2. Player Screen -->
            <div id="player-screen">
                <div class="card-container" id="card-container">
                    <div class="card" id="card" onclick="flipCard()">
                        <!-- Front -->
                        <div class="card-face card-front">
                            <div class="card-type-badge" id="card-type">Word</div>
                            <div class="card-word" id="card-word">...</div>
                            <div class="flip-hint">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                                Tap to reveal
                            </div>
                        </div>
                        <!-- Back -->
                        <div class="card-face card-back">
                            <div class="back-section">
                                <div class="back-label">Reading</div>
                                <div class="readings-row" id="readings-row"></div>
                            </div>
                            <div class="back-section">
                                <div class="back-label">Meaning</div>
                                <div class="meaning-en" id="meaning-en"></div>
                                <div class="meaning-np" id="meaning-np"></div>
                            </div>
                            <div class="back-section" id="example-section" style="display: none;">
                                <div class="back-label">Example</div>
                                <div class="example-box">
                                    <button class="audio-btn" onclick="playExample(event)">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                                    </button>
                                    <div class="example-jp" id="example-jp"></div>
                                    <div class="example-en" id="example-en"></div>
                                    <div class="example-np" id="example-np"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <button class="ctrl-btn btn-prev" id="btn-prev" onclick="prevCard()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                    <button class="ctrl-btn btn-next" id="btn-next" onclick="nextCard()">
                        Next
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
                    </button>
                </div>
            </div>

            <!-- 3. Complete Screen -->
            <div id="complete-screen">
                <div class="complete-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
                </div>
                <div class="complete-title">Deck Complete!</div>
                <div class="complete-sub">Great job! You've reviewed all the cards in this deck.</div>
                <button class="setup-btn primary" onclick="restartDeck()">
                    <span></span> Review Again
                </button>
                <button class="setup-btn" onclick="window.location.href='flashcards.html'">
                    <span>📚</span> Back to Decks
                </button>
            </div>
        </main>
    </div>

    <script src="app.js?v=19.0"></script>

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function loadDeckData() {
            const params = new URLSearchParams(window.location.search);
            deckType = params.get('type') || 'vocab';
            deckLevel = params.get('level') || 'n5';

            document.getElementById('deck-label').textContent = deckType === 'aarav' ? 'Special Deck' : `${deckLevel.toUpperCase()} ${deckType.charAt(0).toUpperCase() + deckType.slice(1)}`;
            document.getElementById('deck-title').textContent = 'Loading...';

            try {
                let rawData = [];
                if (deckType === 'aarav') {
                    document.getElementById('deck-title').textContent = "Aarav Sensei's Special";
                    rawData = aaravSpecialData;
                } else if (deckType === 'kanji') {
                    document.getElementById('deck-title').textContent = `${deckLevel.toUpperCase()} Kanji`;
                    const res = await fetch(`kanji_${deckLevel}.json?v=19.0`);
                    const data = await res.json();
                    
                    rawData = data.map(k => {
                        let exJp = k.example_jp || k.example_sentence || k.sentence || k.example || '';
                        let exEn = k.example_en || k.example_english || '';
                        let exNp = k.example_ne || k.example_np || '';

                        if (!exJp && k.examples) {
                            if (Array.isArray(k.examples) && k.examples.length > 0) {
                                if (typeof k.examples[0] === 'string') {
                                    exJp = k.examples.join(', ');
                                    exEn = 'Example words';
                                } else if (typeof k.examples[0] === 'object') {
                                    exJp = k.examples[0]?.jp || k.examples[0]?.sentence || k.examples[0]?.text || '';
                                    exEn = k.examples[0]?.en || k.examples[0]?.english || '';
                                    exNp = k.examples[0]?.ne || k.examples[0]?.np || '';
                                }
                            } else if (typeof k.examples === 'object') {
                                exJp = k.examples.jp || k.examples.sentence || '';
                                exEn = k.examples.en || '';
                                exNp = k.examples.ne || '';
                            }
                        }

                        return {
                            word: k.character || k.kanji || '?',
                            type: 'kanji',
                            onyomi: k.onyomi || '',
                            kunyomi: k.kunyomi || '',
                            reading: k.reading || k.kunyomi || k.onyomi || '',
                            meaning_en: Array.isArray(k.meanings) ? k.meanings.join(', ') : (k.meaning || ''),
                            meaning_np: Array.isArray(k.meanings_ne) ? k.meanings_ne.join(', ') : (k.meaningNepali || k.meaning_ne || k.meaning || ''),
                            example_jp: exJp,
                            example_en: exEn,
                            example_np: exNp
                        };
                    });
                } else {
                    document.getElementById('deck-title').textContent = `${deckLevel.toUpperCase()} Vocabulary`;
                    const res = await fetch(`vocab_${deckLevel}.json?v=19.0`);
                    const data = await res.json();
                    
                    if (Array.isArray(data) && data.length > 0 && data[0].words) {
                        data.forEach(lesson => {
                            if (lesson.words) {
                                lesson.words.forEach(w => {
                                    rawData.push({
                                        word: w.word,
                                        type: w.type || 'word',
                                        reading: w.romaji || w.reading,
                                        meaning_en: w.meaning_en,
                                        meaning_np: w.meaning_ne,
                                        example_jp: w.example_jp || '',
                                        example_en: w.example_en || '',
                                        example_np: w.example_np || ''
                                    });
                                });
                            }
                        });
                    } else if (Array.isArray(data)) {
                        rawData = data.map(w => ({
                            word: w.word || w.japanese,
                            type: w.type || 'word',
                            reading: w.romaji || w.reading,
                            meaning_en: w.meaning_en || w.meaning,
                            meaning_np: w.meaning_ne || w.meaning_np,
                            example_jp: w.example_jp || '',
                            example_en: w.example_en || '',
                            example_np: w.example_np || ''
                        }));
                    }
                }

                allCards = rawData;
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('setup-screen').style.display = 'flex';

            } catch (error) {
                document.getElementById('loading-screen').innerHTML = `<div style="color: var(--accent-error)">Error loading data.<br>Make sure JSON files exist!</div>`;
                console.error(error);
            }
        }

        function startDeck(mode) {
            if (mode === 'shuffle') {
                allCards = shuffleArray([...allCards]);
            }
            currentIndex = 0;
            isFlipped = false;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('player-screen').style.display = 'flex';
            renderCard();
        }

        function renderCard() {
            if (allCards.length === 0) return;
            const card = allCards[currentIndex];
            
            isFlipped = false;
            document.getElementById('card').classList.remove('flipped');

            document.getElementById('progress-counter').textContent = `${currentIndex + 1} / ${allCards.length}`;
            document.getElementById('btn-prev').disabled = currentIndex === 0;

            document.getElementById('card-type').textContent = card.type || 'Word';
            document.getElementById('card-word').textContent = card.word;

            let readingsHTML = '';
            
            if (card.reading && (deckType === 'aarav' || deckType === 'vocab')) {
                readingsHTML += `<div class="reading-pill">${card.reading}</div>`;
            }
            
            if (deckType === 'kanji') {
                if (card.onyomi) readingsHTML += `<div class="reading-pill"><span>On</span> ${card.onyomi}</div>`;
                if (card.kunyomi) readingsHTML += `<div class="reading-pill"><span>Kun</span> ${card.kunyomi}</div>`;
                if (!card.onyomi && !card.kunyomi && card.reading) {
                     readingsHTML += `<div class="reading-pill">${card.reading}</div>`;
                }
            }

            document.getElementById('readings-row').innerHTML = readingsHTML || '<div class="reading-pill">No reading data</div>';
            
            document.getElementById('meaning-en').textContent = card.meaning_en || '';
            document.getElementById('meaning-np').textContent = card.meaning_np || '';

            if (card.example_jp) {
                document.getElementById('example-section').style.display = 'block';
                document.getElementById('example-jp').textContent = card.example_jp;
                document.getElementById('example-en').textContent = card.example_en || '';
                document.getElementById('example-np').textContent = card.example_np || '';
                currentExampleText = card.example_jp;
            } else {
                document.getElementById('example-section').style.display = 'none';
                currentExampleText = card.reading || card.word; 
            }
        }

        function flipCard() {
            isFlipped = !isFlipped;
            document.getElementById('card').classList.toggle('flipped');
        }

        function nextCard() {
            if (currentIndex < allCards.length - 1) {
                currentIndex++;
                renderCard();
            } else {
                showComplete();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        function showComplete() {
            document.getElementById('player-screen').style.display = 'none';
            document.getElementById('complete-screen').style.display = 'flex';
            document.getElementById('progress-counter').textContent = 'Done';
        }

        function restartDeck() {
            document.getElementById('complete-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
        }

        function playExample(event) {
            event.stopPropagation();
            if (!currentExampleText) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(currentExampleText);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.9;
            const voices = window.speechSynthesis.getVoices();
            const jpVoice = voices.find(v => v.lang.includes('ja'));
            if (jpVoice) utterance.voice = jpVoice;
            window.speechSynthesis.speak(utterance);
        }

        const cardContainer = document.getElementById('card-container');
        cardContainer.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        cardContainer.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) nextCard();
                else prevCard();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('player-screen').style.display === 'flex') {
                if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); flipCard(); } 
                else if (e.code === 'ArrowRight') nextCard();
                else if (e.code === 'ArrowLeft') prevCard();
            }
        });

        loadDeckData();
    </script>
</body>
</html>
