<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#09090B">
    <title>Flashcards - Fuji Learn</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=19.0">
    <script>
        (function() {
            const saved = localStorage.getItem('fuji_theme');
            const theme = saved ? JSON.parse(saved) : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        .sub-header { position: relative !important; top: auto !important; display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); background: var(--bg-primary); border-bottom: 1px solid var(--border-subtle); }
        .sub-header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.02em; flex: 1; text-align: center; margin: 0; }
        .back-btn { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; color: var(--text-primary); transition: background 0.2s ease; text-decoration: none; cursor: pointer; border: none; background: none; }
        .back-btn:active { background: var(--bg-tertiary); }
        .header-spacer { width: 40px; }
        .app-main { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }

        /* 2-Column Grid Layout */
        .deck-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            padding: 0 16px; 
        }
        
        .deck-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 20px 12px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
            touch-action: manipulation;
        }
        .deck-card:active { transform: scale(0.96); border-color: var(--accent-primary); background: var(--bg-tertiary); }
        
        .deck-icon {
            width: 56px; height: 56px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; flex-shrink: 0;
            font-family: var(--font-jp, sans-serif); font-weight: 800;
        }
        
        .deck-info { width: 100%; }
        .deck-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; color: var(--text-primary); line-height: 1.2; }
        .deck-count { font-size: 0.75rem; color: var(--text-secondary); line-height: 1.3; }

        .icon-vocab { background: rgba(168, 85, 247, 0.15); color: #a855f7; }
        .icon-kanji { background: rgba(248, 113, 113, 0.15); color: #f87171; }
        .icon-special { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
    </style>
</head>
<body>
    <div class="app-container animate-fade-in">
        <header class="sub-header">
            <button class="back-btn" onclick="window.history.back()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <h1>Flashcards</h1>
            <div class="header-spacer"></div>
        </header>

        <main class="app-main">
            <div style="padding: 0 16px; margin-bottom: 16px;">
                <h2 style="font-size: 1.2rem; font-weight: 700; margin: 0; letter-spacing: -0.02em;">Choose a Deck</h2>
                <p style="font-size: 0.9rem; color: var(--text-secondary); margin: 4px 0 0 0;">Select a category to start studying.</p>
            </div>
            
            <div class="deck-grid">
                <a href="flashcard-player.html?type=vocab&level=n5" class="deck-card">
                    <div class="deck-icon icon-vocab">語</div>
                    <div class="deck-info">
                        <div class="deck-title">Vocabulary N5</div>
                        <div class="deck-count">Beginner Words</div>
                    </div>
                </a>

                <a href="flashcard-player.html?type=vocab&level=n4" class="deck-card">
                    <div class="deck-icon icon-vocab">語</div>
                    <div class="deck-info">
                        <div class="deck-title">Vocabulary N4</div>
                        <div class="deck-count">Intermediate Words</div>
                    </div>
                </a>

                <a href="flashcard-player.html?type=kanji&level=n5" class="deck-card">
                    <div class="deck-icon icon-kanji">文</div>
                    <div class="deck-info">
                        <div class="deck-title">Kanji N5</div>
                        <div class="deck-count">Basic Characters</div>
                    </div>
                </a>

                <a href="flashcard-player.html?type=kanji&level=n4" class="deck-card">
                    <div class="deck-icon icon-kanji">文</div>
                    <div class="deck-info">
                        <div class="deck-title">Kanji N4</div>
                        <div class="deck-count">Intermediate Characters</div>
                    </div>
                </a>

                <a href="flashcard-player.html?type=aarav" class="deck-card">
                    <div class="deck-icon icon-special">🌟</div>
                    <div class="deck-info">
                        <div class="deck-title">Aarav Sensei's</div>
                        <div class="deck-count">Special Curated List</div>
                    </div>
                </a>
            </div>
        </main>
    </div>
    <script src="app.js?v=19.0"></script>
</body>
</html>
