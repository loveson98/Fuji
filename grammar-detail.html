<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#09090B">
    <title>Grammar Point - Fuji Learn</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=24.0">
    <script>
        (function() {
            const saved = localStorage.getItem('fuji_theme');
            const theme = saved ? JSON.parse(saved) : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        .sub-header { 
            position: sticky !important; 
            top: 0; 
            z-index: 50;
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 12px 16px; 
            padding-top: calc(12px + env(safe-area-inset-top, 0px)); 
            background: var(--bg-primary, #09090B); 
            border-bottom: 1px solid var(--border-subtle, #27272a); 
            backdrop-filter: blur(10px);
        }
        .sub-header h1 { 
            font-size: 1rem; 
            font-weight: 600; 
            letter-spacing: -0.02em; 
            flex: 1; 
            text-align: center; 
            margin: 0; 
            color: var(--text-primary, #ffffff);
        }
        .back-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            color: var(--text-primary, #ffffff); 
            transition: background 0.2s ease; 
            text-decoration: none; 
            cursor: pointer; 
            border: none; 
            background: none; 
        }
        .back-btn:active { background: var(--bg-tertiary, #27272a); }
        .header-spacer { width: 40px; }
        
        .app-main { 
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .grammar-header {
            background: linear-gradient(135deg, #818cf8, #6366f1);
            padding: 32px 20px 36px 20px;
            text-align: center;
            color: white;
        }
        .eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            margin-bottom: 16px;
            justify-content: center;
        }
        .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: white; box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.3); }
        .eyebrow .divider { width: 40px; height: 1px; background: rgba(255, 255, 255, 0.4); }
        
        .grammar-title {
            font-size: clamp(2rem, 7vw, 3rem);
            font-weight: 900;
            margin: 0 0 12px 0;
            font-family: var(--font-jp, sans-serif);
            letter-spacing: -0.02em;
            line-height: 1.2;
            word-break: break-word;
        }
        .grammar-meaning { font-size: 1.1rem; opacity: 0.95; font-weight: 500; margin-bottom: 8px; line-height: 1.4; }
        .grammar-meaning-ne { font-size: 1rem; opacity: 0.85; font-weight: 400; color: rgba(255,255,255,0.85); line-height: 1.4; }
        
        .grammar-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; justify-content: center; }
        .meta-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 20px; font-size: 12px; color: white; }
        .meta-chip .label { opacity: 0.8; text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; }
        .meta-chip .value { font-weight: 600; }

        .content-scroll { 
            flex: 1; 
            overflow-y: auto; 
            padding: 24px 16px; 
            padding-bottom: 100px;
        }
        .info-section { margin-bottom: 36px; }
        
        .section-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
        .section-num { font-size: 14px; color: var(--accent-primary, #818cf8); font-weight: 600; font-style: italic; font-family: Georgia, serif; }
        .section-title { font-size: 1.25rem; font-weight: 700; color: var(--text-primary, #ffffff); letter-spacing: -0.01em; margin: 0; }
        .section-line { flex: 1; height: 1px; background: var(--border-subtle, #27272a); align-self: center; margin-left: 4px; }

        .formation-box {
            background: var(--bg-tertiary, #27272a);
            border: 2px solid var(--accent-primary, #818cf8);
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary, #ffffff);
            font-family: var(--font-jp, sans-serif);
            line-height: 1.6;
            word-break: break-word;
        }
        
        .explanation-text { 
            font-size: 1rem; 
            color: var(--text-secondary, #a1a1aa); 
            line-height: 1.7; 
            margin-bottom: 12px; 
        }
        .explanation-ne { 
            font-size: 0.95rem; 
            color: var(--accent-primary, #818cf8); 
            line-height: 1.6; 
            font-style: italic; 
            border-left: 3px solid var(--accent-primary, #818cf8); 
            padding: 12px;
            margin-top: 8px;
            background: rgba(129, 140, 248, 0.08);
            border-radius: 0 8px 8px 0;
        }
        
        .example-item {
            background: var(--bg-tertiary, #27272a);
            border-left: 4px solid var(--accent-success, #10b981);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            position: relative;
        }
        .example-item:last-child { margin-bottom: 0; }
        .example-number { position: absolute; top: 12px; right: 16px; font-size: 13px; color: var(--text-tertiary, #71717a); font-style: italic; font-family: Georgia, serif; }
        
        .example-jp {
            font-size: 1.1rem; 
            font-weight: 600; 
            color: var(--text-primary, #ffffff); 
            margin-bottom: 8px; 
            font-family: var(--font-jp, sans-serif); 
            line-height: 1.6; 
            padding-right: 40px; 
            display: flex; 
            align-items: flex-start; 
            gap: 12px;
            word-break: break-word;
        }
        .example-jp-text { flex: 1; }
        
        .jp-audio-btn {
            flex-shrink: 0; 
            width: 32px;
            height: 32px; 
            background: var(--accent-primary, #818cf8); 
            border-radius: 50%; 
            border: none; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            margin-top: 2px;
            transition: transform 0.1s ease;
        }
        .jp-audio-btn:active { transform: scale(0.9); }
        .jp-audio-btn svg { width: 16px; height: 16px; }
        
        .example-en { font-size: 0.9rem; color: var(--text-secondary, #a1a1aa); font-style: italic; margin-bottom: 6px; line-height: 1.5; }
        .example-ne { font-size: 0.85rem; color: var(--accent-primary, #818cf8); font-weight: 500; line-height: 1.5; }

        .notes-box { 
            background: var(--bg-tertiary, #27272a); 
            border-left: 4px solid var(--accent-primary, #818cf8); 
            border-radius: 0 12px 12px 0; 
            padding: 16px; 
        }
        .notes-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 12px; color: var(--accent-primary, #818cf8); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.1em; }
        .notes-title svg { width: 14px; height: 14px; }
        .usage-text { font-size: 0.95rem; color: var(--text-secondary, #a1a1aa); line-height: 1.7; padding-left: 20px; position: relative; }
        .usage-text::before { content: '※'; position: absolute; left: 0; top: 0; color: var(--accent-primary, #818cf8); font-weight: 600; }

        .nav-buttons {
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: var(--bg-primary, #09090B); 
            border-top: 1px solid var(--border-subtle, #27272a); 
            padding: 12px 16px; 
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            z-index: 100;
        }
        .nav-btn {
            background: var(--bg-secondary, #18181b); 
            border: 1px solid var(--border-subtle, #27272a); 
            border-radius: 12px; 
            padding: 14px; 
            font-size: 0.95rem; 
            font-weight: 600; 
            color: var(--text-primary, #ffffff); 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 8px; 
            transition: all 0.2s ease; 
            min-height: 48px;
        }
        .nav-btn:active { transform: scale(0.97); background: var(--bg-tertiary, #27272a); }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .nav-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
        
        .loading { text-align: center; padding: 60px 20px; color: var(--text-tertiary, #71717a); font-size: 1rem; }
    </style>
</head>
<body>
    <div class="app-container animate-fade-in">
        <header class="sub-header">
            <button class="back-btn" onclick="window.history.back()" aria-label="Go back">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <h1 id="sub-header-title">Grammar Point</h1>
            <div class="header-spacer"></div>
        </header>

        <main class="app-main" id="grammar-content">
            <div class="loading">Loading grammar point...</div>
        </main>

        <div class="nav-buttons" id="nav-buttons" style="display: none;">
            <button class="nav-btn" id="prev-btn" onclick="goToPrevGrammar()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
                <span>Previous</span>
            </button>
            <button class="nav-btn next" id="next-btn" onclick="goToNextGrammar()">
                <span>Next</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
            </button>
        </div>
    </div>

    <script src="app.js?v=24.0"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentGrammarId = urlParams.get('id');
        let currentLevel = urlParams.get('level') || 'n5';
        let allGrammarData = [];
        let currentIndex = 0;

        function speakText(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP'; 
            utterance.rate = 0.9;
            const voices = window.speechSynthesis.getVoices();
            const jpVoice = voices.find(v => v.lang.includes('ja'));
            if (jpVoice) utterance.voice = jpVoice;
            window.speechSynthesis.speak(utterance);
        }

        async function loadGrammarDetail() {
            const container = document.getElementById('grammar-content');
            if (!currentGrammarId) { container.innerHTML = '<div class="loading">No grammar ID specified</div>'; return; }

            try {
                const res = await fetch(`grammar_${currentLevel}.json?v=24.0`);
                allGrammarData = await res.json();
                
                const grammar = allGrammarData.find(g => String(g.id) === String(currentGrammarId));
                if (!grammar) { container.innerHTML = '<div class="loading">Grammar point not found</div>'; return; }

                currentIndex = allGrammarData.findIndex(g => String(g.id) === String(grammar.id));
                const lang = localStorage.getItem('app_lang') || 'en';
                
                const title = grammar.grammar || grammar.title || 'Unknown';
                const meaning = (lang === 'ne' && grammar.meaning_ne) ? grammar.meaning_ne : grammar.meaning;
                const explanation = grammar.explanation || '';
                const explanationNe = grammar.explanation_ne || '';
                const lesson = grammar.lesson || '';

                document.getElementById('sub-header-title').textContent = `Grammar ${currentLevel.toUpperCase()}`;

                let examplesHTML = '';
                if (grammar.examples && grammar.examples.length > 0) {
                    grammar.examples.forEach((ex, index) => {
                        const cleanJp = ex.jp.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        examplesHTML += `
                            <div class="example-item">
                                <span class="example-number">#${index + 1}</span>
                                <div class="example-jp">
                                    <span class="example-jp-text">${ex.jp}</span>
                                    <button class="jp-audio-btn" onclick="speakText('${cleanJp}')" aria-label="Play audio">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                                    </button>
                                </div>
                                <div class="example-en">${ex.en || ''}</div>
                                ${ex.ne ? `<div class="example-ne">${ex.ne}</div>` : ''}
                            </div>`;
                    });
                }

                let usageHTML = '';
                if (grammar.usage_notes) {
                    usageHTML = `<div class="info-section"><div class="section-header"><span class="section-num">04</span><h2 class="section-title">Important Notes</h2><span class="section-line"></span></div><div class="notes-box"><div class="notes-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0zM12 9v4M12 17h.01"/></svg>Key Points</div><div class="usage-text">${grammar.usage_notes}</div></div></div>`;
                }

                container.innerHTML = `
                    <div class="grammar-header">
                        <div class="eyebrow">
                            <span class="dot"></span>
                            ${lesson ? `Lesson ${lesson} • ` : ''}No. ${String(currentIndex + 1).padStart(3, '0')}
                            <span class="divider"></span>
                        </div>
                        <h2 class="grammar-title">${title}</h2>
                        <p class="grammar-meaning">${meaning}</p>
                        ${grammar.meaning_ne && lang !== 'ne' ? `<p class="grammar-meaning-ne">${grammar.meaning_ne}</p>` : ''}
                        <div class="grammar-meta">
                            <div class="meta-chip"><span class="label">JLPT</span><span class="value">${currentLevel.toUpperCase()}</span></div>
                            ${lesson ? `<div class="meta-chip"><span class="label">Lesson</span><span class="value">${lesson}</span></div>` : ''}
                            <div class="meta-chip"><span class="label">Type</span><span class="value">Grammar</span></div>
                        </div>
                    </div>
                    <div class="content-scroll">
                        ${grammar.formation ? `
                            <div class="info-section">
                                <div class="section-header">
                                    <span class="section-num">01</span>
                                    <h2 class="section-title">Formation</h2>
                                    <span class="section-line"></span>
                                </div>
                                <div class="formation-box">${grammar.formation}</div>
                            </div>
                        ` : ''}
                        ${explanation ? `
                            <div class="info-section">
                                <div class="section-header">
                                    <span class="section-num">02</span>
                                    <h2 class="section-title">Explanation</h2>
                                    <span class="section-line"></span>
                                </div>
                                <div class="explanation-text">${explanation}</div>
                                ${explanationNe ? `<div class="explanation-ne">${explanationNe}</div>` : ''}
                            </div>
                        ` : ''}
                        ${examplesHTML ? `
                            <div class="info-section">
                                <div class="section-header">
                                    <span class="section-num">03</span>
                                    <h2 class="section-title">Examples</h2>
                                    <span class="section-line"></span>
                                </div>
                                ${examplesHTML}
                            </div>
                        ` : ''}
                        ${usageHTML}
                    </div>
                `;

                document.getElementById('nav-buttons').style.display = 'grid';
                const prevG = currentIndex > 0 ? allGrammarData[currentIndex - 1] : null;
                const nextG = currentIndex < allGrammarData.length - 1 ? allGrammarData[currentIndex + 1] : null;
                document.getElementById('prev-btn').disabled = !prevG;
                document.getElementById('next-btn').disabled = !nextG;

            } catch (e) { container.innerHTML = '<div class="loading" style="color: var(--accent-error)">Error loading grammar data.</div>'; console.error(e); }
        }

        function goToPrevGrammar() { if (currentIndex > 0) window.location.replace(`grammar-detail.html?id=${allGrammarData[currentIndex - 1].id}&level=${currentLevel}`); }
        function goToNextGrammar() { if (currentIndex < allGrammarData.length - 1) window.location.replace(`grammar-detail.html?id=${allGrammarData[currentIndex + 1].id}&level=${currentLevel}`); }

        loadGrammarDetail();
    </script>
</body>
</html>
