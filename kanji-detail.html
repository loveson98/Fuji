<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#09090B">
    <title>Kanji Detail - Fuji Learn</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=13.0">
    <script>
        (function() {
            const saved = localStorage.getItem('fuji_theme');
            const theme = saved ? JSON.parse(saved) : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        .sub-header { 
            position: relative !important; 
            top: auto !important; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: var(--space-md) var(--space-lg); 
            padding-top: calc(var(--space-md) + var(--safe-top)); 
            background: var(--bg-primary); 
            border-bottom: 1px solid var(--border-subtle); 
        }
        .sub-header h1 { 
            font-size: 1.1rem; 
            font-weight: 600; 
            letter-spacing: -0.02em; 
            flex: 1; 
            text-align: center; 
            margin: 0; 
            color: var(--text-primary);
        }
        .back-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            color: var(--text-primary); 
            transition: background 0.2s ease; 
            text-decoration: none; 
            cursor: pointer; 
            border: none; 
            background: none; 
        }
        .back-btn:active { background: var(--bg-tertiary); }
        .header-spacer { width: 40px; }
        .app-main { 
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* Pill Toggle */
        .pill-toggle {
            display: flex;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 4px;
            margin: 20px 16px 0 16px;
        }
        .pill-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: var(--radius-full);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            border: none;
            background: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .pill-btn.active {
            background: var(--accent-primary);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        /* Hero Header */
        .kanji-header {
            background: linear-gradient(135deg, #f87171, #ef4444);
            padding: 40px 24px 40px 24px;
            text-align: center;
            color: white;
        }
        
        .eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            margin-bottom: 20px;
            justify-content: center;
        }
        .eyebrow .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.3);
        }
        .eyebrow .divider {
            width: 40px;
            height: 1px;
            background: rgba(255, 255, 255, 0.4);
        }
        
        .kanji-title {
            font-size: 5rem;
            font-weight: 900;
            margin: 0 0 12px 0;
            font-family: var(--font-jp);
            letter-spacing: -0.02em;
            line-height: 1;
        }
        .kanji-meaning {
            font-size: 1.2rem;
            opacity: 0.95;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .kanji-meaning-ne {
            font-size: 1rem;
            opacity: 0.85;
            font-weight: 400;
        }
        
        .kanji-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 24px;
            justify-content: center;
        }
        .meta-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            font-size: 12px;
            color: white;
        }
        .meta-chip .label {
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 10px;
        }
        .meta-chip .value { font-weight: 600; }

        /* Content Scroll Area */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            padding-bottom: 100px;
        }

        .info-section { margin-bottom: 32px; }
        
        .section-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 20px;
        }
        .section-num {
            font-size: 14px;
            color: var(--accent-primary);
            font-weight: 600;
            font-style: italic;
            font-family: Georgia, serif;
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }
        .section-line {
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
            align-self: center;
            margin-left: 4px;
        }

        .readings-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .reading-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .reading-row:last-child {
            padding-bottom: 0;
            border-bottom: none;
        }
        .reading-type {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .reading-value {
            font-size: 1.3rem;
            color: var(--text-primary);
            font-family: var(--font-jp);
            font-weight: 700;
        }

        .example-item {
            background: var(--bg-tertiary);
            border-left: 3px solid var(--accent-success);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            position: relative;
        }
        .example-item:last-child { margin-bottom: 0; }
        .example-number {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 13px;
            color: var(--text-tertiary);
            font-style: italic;
            font-family: Georgia, serif;
        }
        .example-jp {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-family: var(--font-jp);
            line-height: 1.7;
            padding-right: 32px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .example-jp-text { flex: 1; }
        .jp-audio-btn {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            background: var(--accent-primary);
            border-radius: 50%;
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-top: 4px;
            transition: transform 0.1s ease;
        }
        .jp-audio-btn:active { transform: scale(0.9); }
        .jp-audio-btn svg { width: 14px; height: 14px; }

        .example-en {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-style: italic;
            margin-bottom: 6px;
        }
        .example-ne {
            font-size: 0.85rem;
            color: var(--accent-primary);
            font-weight: 500;
        }

        /* Stroke Canvas Styles - FIXED FOR DARK MODE & VISIBILITY */
        .stroke-container { 
            background: var(--bg-secondary); 
            border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-lg); 
            padding: 20px; 
            margin: 20px 16px 20px 16px; 
        }
        .canvas-wrapper { 
            position: relative; 
            width: 100%; 
            max-width: 350px; 
            margin: 0 auto; 
            background: var(--bg-tertiary); /* Theme-aware dark/light background */
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md); 
            overflow: hidden; 
            aspect-ratio: 1/1; 
        }
        .kanji-guide { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 280px; 
            font-family: var(--font-jp); 
            color: var(--accent-primary); /* Faint purple, visible in BOTH light and dark mode */
            opacity: 0.15; 
            pointer-events: none; 
            user-select: none; 
            font-weight: 800; 
            transition: opacity 0.3s ease; 
        }
        #stroke-canvas { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            cursor: crosshair; 
            touch-action: none; 
            z-index: 10; 
        }
        .canvas-controls { 
            display: flex; 
            gap: 12px; 
            margin-top: 20px; 
        }
        .canvas-btn { 
            flex: 1; 
            padding: 14px; 
            background: var(--bg-secondary); 
            border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-md); 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: var(--text-primary); 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
        }
        .canvas-btn:active { transform: scale(0.96); background: var(--bg-tertiary); }
        .canvas-btn svg { width: 18px; height: 18px; }

        .nav-buttons {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-subtle);
            padding: 12px 16px;
            padding-bottom: calc(12px + var(--safe-bottom));
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            z-index: 100;
        }
        .nav-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            min-height: 52px;
        }
        .nav-btn:active { transform: scale(0.97); background: var(--bg-tertiary); }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .nav-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
        .nav-btn.next { justify-content: flex-end; text-align: right; }
        .nav-btn.next svg { order: 2; }
        .nav-content { display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .nav-label {
            font-size: 10px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 2px;
            font-weight: 600;
        }
        .nav-kanji {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: var(--font-jp);
        }

        .loading { text-align: center; padding: 60px 20px; color: var(--text-tertiary); font-size: 1rem; }
    </style>
</head>
<body>
    <div class="app-container animate-fade-in">
        <header class="sub-header">
            <button class="back-btn" onclick="window.history.back()" aria-label="Go back">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <h1 id="sub-header-title">Kanji Detail</h1>
            <div class="header-spacer"></div>
        </header>

        <div class="pill-toggle">
            <button class="pill-btn active" onclick="switchTab('kanji', this)">Kanji</button>
            <button class="pill-btn" onclick="switchTab('stroke', this)">Stroke Practice</button>
        </div>

        <main class="app-main" id="kanji-content">
            <div class="loading">Loading kanji detail...</div>
        </main>

        <div class="nav-buttons" id="nav-buttons" style="display: none;">
            <button class="nav-btn" id="prev-btn" onclick="goToPrevKanji()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
                <div class="nav-content">
                    <div class="nav-label">Previous</div>
                    <div class="nav-kanji" id="prev-title">-</div>
                </div>
            </button>
            <button class="nav-btn next" id="next-btn" onclick="goToNextKanji()">
                <div class="nav-content">
                    <div class="nav-label">Next</div>
                    <div class="nav-kanji" id="next-title">-</div>
                </div>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
            </button>
        </div>
    </div>

    <script src="app.js?v=13.0"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentKanjiId = urlParams.get('id');
        let currentLevel = urlParams.get('level') || 'n5';
        let allKanjiData = [];
        let currentIndex = 0;
        let currentKanji = null;
        
        // Canvas variables
        let canvas, ctx, isDrawing = false, guideVisible = true;

        function speakText(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.8;
            const voices = window.speechSynthesis.getVoices();
            const jpVoice = voices.find(v => v.lang.includes('ja'));
            if (jpVoice) utterance.voice = jpVoice;
            window.speechSynthesis.speak(utterance);
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const main = document.getElementById('kanji-content');
            if (tab === 'kanji') {
                renderKanjiInfo(main);
            } else {
                renderStrokePractice(main);
                setTimeout(initCanvas, 50);
            }
        }

        async function loadKanjiDetail() {
            const container = document.getElementById('kanji-content');
            if (!currentKanjiId) { 
                container.innerHTML = '<div class="loading">No Kanji ID specified</div>'; 
                return; 
            }

            try {
                const jsonFile = currentLevel === 'n4' ? 'kanji_n4.json?v=13.0' : 'kanji_n5.json?v=13.0';
                const res = await fetch(jsonFile);
                allKanjiData = await res.json();
                
                const kanji = allKanjiData.find(k => 
                    (k.id && String(k.id) === String(currentKanjiId)) || 
                    k.character === currentKanjiId || 
                    k.kanji === currentKanjiId
                );

                if (!kanji) { 
                    container.innerHTML = '<div class="loading">Kanji not found</div>'; 
                    return; 
                }

                currentKanji = kanji;
                currentIndex = allKanjiData.findIndex(k => k === kanji);
                
                document.getElementById('sub-header-title').textContent = `Kanji ${currentLevel.toUpperCase()} Detail`;
                
                renderKanjiInfo(container);

                document.getElementById('nav-buttons').style.display = 'grid';
                const prevKanji = currentIndex > 0 ? allKanjiData[currentIndex - 1] : null;
                const nextKanji = currentIndex < allKanjiData.length - 1 ? allKanjiData[currentIndex + 1] : null;
                const prevChar = prevKanji ? (prevKanji.character || prevKanji.kanji) : '';
                const nextChar = nextKanji ? (nextKanji.character || nextKanji.kanji) : '';

                if (prevKanji) {
                    document.getElementById('prev-title').textContent = prevChar;
                    document.getElementById('prev-btn').disabled = false;
                } else {
                    document.getElementById('prev-btn').disabled = true;
                }
                if (nextKanji) {
                    document.getElementById('next-title').textContent = nextChar;
                    document.getElementById('next-btn').disabled = false;
                } else {
                    document.getElementById('next-btn').disabled = true;
                }

            } catch (e) {
                container.innerHTML = '<div class="loading" style="color: var(--accent-error)">Error loading kanji data.</div>';
                console.error(e);
            }
        }

        function renderKanjiInfo(container) {
            if (!currentKanji) return;
            const char = currentKanji.character || currentKanji.kanji || '？';
            const meanings = currentKanji.meanings || (currentKanji.meaning ? [currentKanji.meaning] : ['Unknown']);
            const meaningsNe = currentKanji.meanings_ne || (currentKanji.meaningNepali ? [currentKanji.meaningNepali] : ['Unknown']);
            const strokes = currentKanji.strokeCount || currentKanji.strokes || '?';
            const onyomi = currentKanji.onyomi || 'N/A';
            const kunyomi = currentKanji.kunyomi || 'N/A';

            let examplesHTML = '';
            if (currentKanji.examples && currentKanji.examples.length > 0) {
                currentKanji.examples.forEach((ex, index) => {
                    let jpText = '', enText = '', neText = '';
                    if (typeof ex === 'object' && ex !== null) {
                        jpText = ex.jp || '';
                        enText = ex.en || '';
                        neText = ex.ne || ex.np || '';
                    } else {
                        jpText = ex;
                    }

                    if (jpText) {
                        const cleanJp = jpText.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        examplesHTML += `
                            <div class="example-item">
                                <span class="example-number">#${index + 1}</span>
                                <div class="example-jp">
                                    <span class="example-jp-text">${jpText}</span>
                                    <button class="jp-audio-btn" onclick="speakText('${cleanJp}')" aria-label="Play audio">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                                    </button>
                                </div>
                                ${enText ? `<div class="example-en">${enText}</div>` : ''}
                                ${neText ? `<div class="example-ne">${neText}</div>` : ''}
                            </div>
                        `;
                    }
                });
            }

            container.innerHTML = `
                <div class="kanji-header">
                    <div class="eyebrow">
                        <span class="dot"></span>
                        ${currentLevel.toUpperCase()}
                        <span class="divider"></span>
                    </div>
                    <h2 class="kanji-title">${char}</h2>
                    <p class="kanji-meaning">${meanings.join(', ')}</p>
                    ${meaningsNe[0] !== 'Unknown' ? `<p class="kanji-meaning-ne">${meaningsNe.join(', ')}</p>` : ''}
                    <div class="kanji-meta">
                        <div class="meta-chip"><span class="label">Strokes</span><span class="value">${strokes}</span></div>
                    </div>
                </div>

                <div class="content-scroll">
                    <div class="info-section">
                        <div class="section-header">
                            <span class="section-num">01</span>
                            <h2 class="section-title">Readings</h2>
                            <span class="section-line"></span>
                        </div>
                        <div class="readings-box">
                            <div class="reading-row">
                                <span class="reading-type">Onyomi (Chinese)</span>
                                <span class="reading-value">${onyomi}</span>
                            </div>
                            <div class="reading-row">
                                <span class="reading-type">Kunyomi (Japanese)</span>
                                <span class="reading-value">${kunyomi}</span>
                            </div>
                        </div>
                    </div>

                    ${examplesHTML ? `
                        <div class="info-section">
                            <div class="section-header">
                                <span class="section-num">02</span>
                                <h2 class="section-title">Examples</h2>
                                <span class="section-line"></span>
                            </div>
                            ${examplesHTML}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderStrokePractice(container) {
            if (!currentKanji) return;
            const char = currentKanji.character || currentKanji.kanji || '?';
            
            container.innerHTML = `
                <div class="stroke-container">
                    <div class="canvas-wrapper">
                        <div class="kanji-guide" id="stroke-guide" style="opacity: ${guideVisible ? '0.15' : '0'}">${char}</div>
                        <canvas id="stroke-canvas" width="350" height="350"></canvas>
                    </div>
                    <div class="canvas-controls">
                        <button class="canvas-btn" onclick="clearCanvas()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            Clear
                        </button>
                        <button class="canvas-btn" onclick="toggleGuide()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            <span id="guide-btn-text">${guideVisible ? 'Hide Guide' : 'Show Guide'}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function initCanvas() {
            canvas = document.getElementById('stroke-canvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            ctx.strokeStyle = '#818cf8'; // Bright purple pops beautifully on dark background
            ctx.lineWidth = 12;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
            canvas.addEventListener('touchstart', handleTouch, { passive: false });
            canvas.addEventListener('touchmove', handleTouch, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);
        }

        function startDrawing(e) {
            isDrawing = true;
            ctx.beginPath();
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            ctx.moveTo(x, y);
        }
        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();
        }
        function stopDrawing() { isDrawing = false; }
        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent(e.type === 'touchstart' ? 'mousedown' : e.type === 'touchmove' ? 'mousemove' : 'mouseup', { clientX: touch.clientX, clientY: touch.clientY });
            canvas.dispatchEvent(mouseEvent);
        }
        function clearCanvas() { if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height); }
        
        function toggleGuide() {
            const guide = document.getElementById('stroke-guide');
            const btnText = document.getElementById('guide-btn-text');
            guideVisible = !guideVisible;
            
            // Just toggle opacity and text, DO NOT re-render the whole tab (which erases the drawing!)
            guide.style.opacity = guideVisible ? '0.15' : '0';
            if (btnText) btnText.textContent = guideVisible ? 'Hide Guide' : 'Show Guide';
        }

        function resetKanjiPill() {
            document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            const firstPill = document.querySelector('.pill-btn');
            if (firstPill) firstPill.classList.add('active');
        }

        function goToPrevKanji() {
            if (currentIndex > 0) {
                const prev = allKanjiData[currentIndex - 1];
                currentKanjiId = prev.id || prev.character || prev.kanji;
                try { history.replaceState(null, '', `kanji-detail.html?id=${encodeURIComponent(currentKanjiId)}&level=${currentLevel}`); } catch (e) {}
                resetKanjiPill();
                loadKanjiDetail();
                window.scrollTo(0, 0);
            }
        }

        function goToNextKanji() {
            if (currentIndex < allKanjiData.length - 1) {
                const next = allKanjiData[currentIndex + 1];
                currentKanjiId = next.id || next.character || next.kanji;
                try { history.replaceState(null, '', `kanji-detail.html?id=${encodeURIComponent(currentKanjiId)}&level=${currentLevel}`); } catch (e) {}
                resetKanjiPill();
                loadKanjiDetail();
                window.scrollTo(0, 0);
            }
        }

        loadKanjiDetail();
    </script>
</body>
</html>
