<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual">
    <meta name="theme-color" content="#09090B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Aarav Sensei - Fuji Learn</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css?v=41.0">
    <script>
        (function() {
            const saved = localStorage.getItem('fuji_theme');
            const theme = saved ? JSON.parse(saved) : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        body {
            margin: 0; padding: 0; background: var(--bg-primary);
            height: 100vh; height: 100dvh; 
            display: flex; flex-direction: column; overflow: hidden;
            overscroll-behavior: none; 
        }
        .sub-header {
            position: relative; background: var(--bg-primary);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px));
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }
        .sub-header h1 {
            font-size: 1.1rem; font-weight: 700; margin: 0; color: var(--text-primary);
            display: flex; align-items: center; gap: 8px;
        }
        .sub-header h1 .jp-name { font-size: 0.85rem; color: var(--accent-primary); }
        .back-btn {
            width: 36px; height: 36px; border-radius: 50%; background: var(--bg-tertiary);
            border: none; color: var(--text-primary); display: flex; align-items: center;
            justify-content: center; cursor: pointer; text-decoration: none;
        }
        .back-btn:active { transform: scale(0.9); }
        
        .model-selector-bar {
            padding: 8px 16px; background: var(--bg-primary);
            border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .model-select {
            background: var(--bg-secondary); border: 1px solid var(--border-subtle);
            color: var(--text-primary); padding: 6px 12px; border-radius: 20px;
            font-size: 0.85rem; font-weight: 600; outline: none; cursor: pointer;
            font-family: inherit;
        }
        .model-select:focus { border-color: var(--accent-primary); }
        
        .ai-messages {
            flex: 1; padding: 16px; overflow-y: auto; display: flex;
            flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch;
            padding-bottom: 10px;
        }
        .ai-msg {
            padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5;
            max-width: 85%; animation: popIn 0.3s ease; word-wrap: break-word;
            white-space: pre-line;
        }
        @keyframes popIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .ai-msg.bot { background: var(--bg-tertiary); color: var(--text-primary); border-bottom-left-radius: 4px; align-self: flex-start; }
        .ai-msg.user { background: var(--accent-primary); color: white; border-bottom-right-radius: 4px; align-self: flex-end; }
        
        .ai-system-notice {
            background: rgba(129, 140, 248, 0.1); border: 1px dashed var(--accent-primary);
            color: var(--accent-primary); padding: 10px 16px; border-radius: 12px;
            font-size: 0.85rem; font-weight: 600; text-align: center;
            max-width: 90%; align-self: center; animation: popIn 0.3s ease;
            line-height: 1.5;
        }
        
        .ai-typing { font-style: italic; color: var(--text-tertiary); font-size: 0.8rem; margin-left: 10px; margin-bottom: 8px; }

        .ai-prompts-container {
            padding: 12px 16px; background: var(--bg-primary);
            border-top: 1px solid var(--border-subtle); flex-shrink: 0;
            transition: opacity 0.2s ease;
        }
        .ai-prompts-label {
            font-size: 0.75rem; font-weight: 600; color: var(--text-tertiary);
            text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .ai-quota-label {
            text-transform: none; letter-spacing: 0; font-weight: 700;
            color: var(--accent-primary); font-size: 0.7rem;
        }
        .ai-prompts-scroll {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
            -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .ai-prompts-scroll::-webkit-scrollbar { display: none; }
        
        .prompt-chip {
            background: var(--bg-secondary); border: 1px solid var(--border-subtle);
            color: var(--text-primary); padding: 10px 16px; border-radius: 20px;
            font-size: 0.85rem; font-weight: 600; white-space: nowrap;
            cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px;
        }
        .prompt-chip:active { transform: scale(0.95); background: var(--bg-tertiary); }

        .ai-input-area {
            padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            background: var(--bg-primary); border-top: 1px solid var(--border-subtle);
            display: flex; gap: 10px; align-items: center; flex-shrink: 0;
            z-index: 10;
        }
        .ai-input {
            flex: 1; background: var(--bg-secondary); border: 1px solid var(--border-subtle);
            border-radius: 24px; padding: 12px 16px; color: var(--text-primary);
            font-size: 1rem; outline: none;
        }
        .ai-input:focus { border-color: var(--accent-primary); }
        .ai-send-btn {
            background: var(--accent-primary); color: white; border: none; border-radius: 50%;
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.1rem; flex-shrink: 0;
        }
        .ai-send-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>
    <header class="sub-header">
        <a href="index.html" class="back-btn" aria-label="Go back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 19l-7-7 7-7"/></svg>
        </a>
        <h1>Aarav Sensei <span class="jp-name">アーラヴ先生</span></h1>
        <div style="width: 36px;"></div>
    </header>

    <div class="model-selector-bar">
        <select id="model-select" class="model-select" onchange="switchModel(this.value)">
            <option value="groq">✨ Aarav Standard (Recommended)</option>
            <option value="mistral">⚡ Aarav Extended (Unlimited)</option>
        </select>
    </div>

    <div class="ai-messages" id="ai-messages">
        <div class="ai-msg bot">Hello my dear student! 👋 I am Aarav Sensei. Ask me anything about Japanese — in English, Nepali, or Japanese — or tap a suggestion below! नमस्ते! 😊</div>
    </div>

    <div class="ai-prompts-container" id="ai-prompts">
        <div class="ai-prompts-label">
            <span>Quick Questions</span>
            <span class="ai-quota-label" id="ai-quota"></span>
        </div>
        <div class="ai-prompts-scroll">
            <button class="prompt-chip" onclick="sendPrompt('Explain a grammar point')"> Grammar</button>
            <button class="prompt-chip" onclick="sendPrompt('Help me with Kanji')">🎌 Kanji</button>
            <button class="prompt-chip" onclick="sendPrompt('Teach me a new vocabulary word')">📚 Vocab</button>
            <button class="prompt-chip" onclick="sendPrompt('Give me a daily study tip')">💡 Daily Tip</button>
            <button class="prompt-chip" onclick="sendPrompt('Translate a sentence for me')">🗣️ Translate</button>
        </div>
    </div>

    <div class="ai-input-area">
        <input type="text" id="ai-input" class="ai-input" placeholder="Ask Aarav Sensei..." autocomplete="off" onkeypress="handleAIEnter(event)">
        <button class="ai-send-btn" onclick="sendAIMessage()">➤</button>
    </div>

    <script>
        // ============================================================
        // ⚙️ PRODUCTION SETTINGS — ONLY TOUCH THIS LINE AFTER DEPLOY
        // ============================================================
        // After deploying to Vercel, paste your Vercel URL here:
        // e.g. "https://fuji-learn.vercel.app/api/aarav"
        // 🔒 NO API KEYS, NO PERSONA IN THIS FILE. Everything lives on Vercel.
        const API_URL = "PASTE_YOUR_VERCEL_URL_HERE/api/aarav";

        // --- STATE ---
        let chatHistory = [];
        let currentModel = 'groq';
        let fallbackModeActive = false;

        function switchModel(newModel) {
            currentModel = newModel;
            if (newModel === 'mistral') {
                fallbackModeActive = true;
            } else {
                const wasInFallback = fallbackModeActive;
                fallbackModeActive = false;
                if (wasInFallback) {
                    showSystemNotice("Welcome back to Standard mode! ✨ I'll use my premium brain for your questions.");
                }
            }
            updateQuotaUI();
        }

        function updateQuotaUI() {
            const quotaEl = document.getElementById('ai-quota');
            if (!quotaEl) return;
            if (fallbackModeActive) {
                quotaEl.textContent = 'Extended mode active 💫';
            } else {
                quotaEl.textContent = '';
            }
        }

        function showSystemNotice(message) {
            const messagesContainer = document.getElementById('ai-messages');
            const notice = document.createElement('div');
            notice.className = 'ai-system-notice';
            notice.textContent = message;
            messagesContainer.appendChild(notice);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // --- ANDROID KEYBOARD FIX ---
        if (window.visualViewport) {
            const resizeHandler = () => {
                document.body.style.height = window.visualViewport.height + 'px';
            };
            window.visualViewport.addEventListener('resize', resizeHandler);
            resizeHandler();
        }

        // --- UI FIX: HIDE PROMPTS WHEN TYPING ---
        const aiInput = document.getElementById('ai-input');
        const promptsContainer = document.getElementById('ai-prompts');

        aiInput.addEventListener('focus', () => {
            if (promptsContainer) promptsContainer.style.display = 'none';
            setTimeout(() => {
                const messages = document.getElementById('ai-messages');
                messages.scrollTop = messages.scrollHeight;
            }, 300);
        });

        aiInput.addEventListener('blur', () => {
            setTimeout(() => {
                if (promptsContainer) promptsContainer.style.display = 'block';
            }, 150);
        });

        function handleAIEnter(e) { 
            if (e.key === 'Enter') sendAIMessage(); 
        }

        function sendPrompt(text) {
            processUserMessage(text);
        }

        function sendAIMessage() {
            const input = document.getElementById('ai-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            processUserMessage(text);
        }

        async function processUserMessage(text) {
            const messagesContainer = document.getElementById('ai-messages');
            
            const userMsg = document.createElement('div');
            userMsg.className = 'ai-msg user';
            userMsg.textContent = text;
            messagesContainer.appendChild(userMsg);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            const typingId = 'typing-' + Date.now();
            const typingDiv = document.createElement('div');
            typingDiv.id = typingId;
            typingDiv.className = 'ai-typing';
            typingDiv.textContent = 'Aarav Sensei is thinking... ';
            messagesContainer.appendChild(typingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                const result = await getAIResponse(text, chatHistory, currentModel);
                const response = result.reply;

                chatHistory.push({ role: 'user', content: text });
                chatHistory.push({ role: 'assistant', content: response });
                if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);
                
                const typingElement = document.getElementById(typingId);
                if (typingElement) typingElement.remove();
                
                // Handle auto-fallback signal from server
                if (result.fallback && !fallbackModeActive) {
                    fallbackModeActive = true;
                    currentModel = 'mistral';
                    const selector = document.getElementById('model-select');
                    if (selector) selector.value = 'mistral';
                    showSystemNotice("Heads up! I've switched to Extended mode so we can keep our chat flowing smoothly. I'll be back to Standard mode tomorrow! 💫");
                    updateQuotaUI();
                }
                
                const botMsg = document.createElement('div');
                botMsg.className = 'ai-msg bot';
                botMsg.textContent = response;
                messagesContainer.appendChild(botMsg);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            } catch (error) {
                console.error(error);
                const typingElement = document.getElementById(typingId);
                if (typingElement) typingElement.remove();
                
                const botMsg = document.createElement('div');
                botMsg.className = 'ai-msg bot';
                botMsg.textContent = `Sumimasen! The AI service says: ${error.message} 🙇‍️`;
                messagesContainer.appendChild(botMsg);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        async function getAIResponse(input, history, model) {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: input, history: history, model: model })
            });

            if (!response.ok) {
                let msg = `HTTP ${response.status}`;
                try {
                    const d = await response.json();
                    if (d.error) msg = d.error;
                } catch (e) {}
                throw new Error(msg);
            }

            return await response.json(); // { reply, fallback? }
        }

        updateQuotaUI();
    </script>
</body>
</html>
