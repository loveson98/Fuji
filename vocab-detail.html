<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#09090B">
    <title>Word Detail - Fuji Learn</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=16.0">
    <script>
        (function() {
            const saved = localStorage.getItem('fuji_theme');
            const theme = saved ? JSON.parse(saved) : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        .sub-header { 
            position: relative !important; 
            top: auto !important; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: var(--space-md, 16px) var(--space-lg, 20px); 
            padding-top: calc(var(--space-md, 16px) + env(safe-area-inset-top, 0px)); 
            background: var(--bg-primary); 
            border-bottom: 1px solid var(--border-subtle); 
        }
        .sub-header h1 { 
            font-size: 1rem; 
            font-weight: 600; 
            letter-spacing: -0.02em; 
            flex: 1; 
            text-align: center; 
            margin: 0; 
            color: var(--text-primary);
        }
        .back-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            color: var(--text-primary); 
            transition: background 0.2s ease; 
            text-decoration: none; 
            cursor: pointer; 
            border: none; 
            background: none; 
        }
        .back-btn:active { background: var(--bg-tertiary); }
        .header-spacer { width: 40px; }
        .app-main { 
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        .vocab-header {
            background: linear-gradient(135deg, #818cf8, #6366f1);
            padding: 60px 24px 40px 24px;
            text-align: center;
            color: white;
        }
        
        .eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            margin-bottom: 20px;
            justify-content: center;
        }
        .eyebrow .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.3);
        }
        .eyebrow .divider {
            width: 40px;
            height: 1px;
            background: rgba(255, 255, 255, 0.4);
        }
        
        .vocab-word {
            font-size: 4rem;
            font-weight: 900;
            margin: 0 0 12px 0;
            font-family: var(--font-jp, sans-serif);
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        
        .vocab-reading {
            font-size: 1.3rem;
            opacity: 0.95;
            font-weight: 500;
            font-family: var(--font-jp, sans-serif);
            margin-bottom: 20px;
        }
        
        .vocab-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 24px;
            justify-content: center;
        }
        .meta-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            font-size: 12px;
            color: white;
        }
        .meta-chip .label {
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 10px;
        }
        .meta-chip .value { 
            font-weight: 600; 
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            padding-bottom: 100px;
        }

        .info-section { margin-bottom: 32px; }
        
        .section-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 20px;
        }
        .section-num {
            font-size: 14px;
            color: var(--accent-primary);
            font-weight: 600;
            font-style: italic;
            font-family: Georgia, serif;
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }
        .section-line {
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
            align-self: center;
            margin-left: 4px;
        }

        .section-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-subtle);
        }

        .meaning-text {
            font-size: 1.3rem;
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .meaning-np {
            font-size: 1rem;
            color: var(--accent-primary);
            font-weight: 500;
            line-height: 1.4;
        }

        .example-item {
            background: var(--bg-tertiary);
            border-left: 3px solid var(--accent-success, #10b981);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            position: relative;
        }
        .example-item:last-child { margin-bottom: 0; }
        .example-number {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 13px;
            color: var(--text-tertiary);
            font-style: italic;
            font-family: Georgia, serif;
        }
        
        .example-jp {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-family: var(--font-jp, sans-serif);
            line-height: 1.7;
            padding-right: 32px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .example-jp-text { flex: 1; }
        .jp-audio-btn {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            background: var(--accent-primary);
            border-radius: 50%;
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-top: 4px;
            transition: transform 0.1s ease;
        }
        .jp-audio-btn:active { transform: scale(0.9); }
        .jp-audio-btn svg { width: 14px; height: 14px; }

        .example-en { font-size: 0.9rem; color: var(--text-secondary); font-style: italic; margin-bottom: 6px; }
        .example-ne { font-size: 0.85rem; color: var(--accent-primary); font-weight: 500; }

        .nav-buttons {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-subtle);
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            z-index: 100;
        }
        .nav-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            min-height: 52px;
        }
        .nav-btn:active { transform: scale(0.97); background: var(--bg-tertiary); }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .nav-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
        .nav-btn.next { justify-content: flex-end; text-align: right; }
        .nav-btn.next svg { order: 2; }
        .nav-content { display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .nav-label {
            font-size: 10px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 2px;
            font-weight: 600;
        }
        .nav-word {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: var(--font-jp, sans-serif);
        }

        .loading { text-align: center; padding: 60px 20px; color: var(--text-tertiary); font-size: 1rem; }
    </style>
</head>
<body>
    <div class="app-container animate-fade-in">
        <header class="sub-header">
            <button class="back-btn" onclick="window.history.back()" aria-label="Go back">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <h1 id="sub-header-title">Vocabulary</h1>
            <div class="header-spacer"></div>
        </header>

        <main class="app-main" id="vocab-content">
            <div class="loading">Loading word details...</div>
        </main>

        <div class="nav-buttons" id="nav-buttons" style="display: none;">
            <button class="nav-btn" id="prev-btn" onclick="goToPrevWord()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
                <div class="nav-content">
                    <div class="nav-label">Previous</div>
                    <div class="nav-word" id="prev-title">-</div>
                </div>
            </button>
            <button class="nav-btn next" id="next-btn" onclick="goToNextWord()">
                <div class="nav-content">
                    <div class="nav-label">Next</div>
                    <div class="nav-word" id="next-title">-</div>
                </div>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
            </button>
        </div>
    </div>

    <script src="app.js?v=16.0"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentWordId = urlParams.get('id');
        const level = urlParams.get('level') || 'n5';
        let allWordsData = [];
        let currentIndex = 0;

        function speakText(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.9;
            const voices = window.speechSynthesis.getVoices();
            const jpVoice = voices.find(v => v.lang.includes('ja'));
            if (jpVoice) utterance.voice = jpVoice;
            window.speechSynthesis.speak(utterance);
        }

        async function loadVocabDetail() {
            const container = document.getElementById('vocab-content');
            if (!currentWordId) { 
                container.innerHTML = '<div class="loading">No word ID specified</div>'; 
                return; 
            }

            try {
                const res = await fetch(`vocab_${level}.json?v=16.0`);
                const vocabData = await res.json();
                
                allWordsData = [];
                vocabData.forEach(lesson => {
                    if (lesson.words && Array.isArray(lesson.words)) {
                        lesson.words.forEach(word => {
                            allWordsData.push(word);
                        });
                    }
                });
                
                const word = allWordsData.find(w => String(w.id) === String(currentWordId));
                if (!word) { 
                    container.innerHTML = '<div class="loading">Word not found</div>'; 
                    return; 
                }

                currentIndex = allWordsData.findIndex(w => String(w.id) === String(word.id));
                document.getElementById('sub-header-title').textContent = word.word;

                let exampleHTML = '';
                if (word.example_jp) {
                    const exEn = word.example_en || '';
                    const exNe = word.example_ne || '';
                    const cleanJp = word.example_jp.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    
                    exampleHTML = `
                        <div class="info-section">
                            <div class="section-header">
                                <span class="section-num">02</span>
                                <h2 class="section-title">Example Sentence</h2>
                                <span class="section-line"></span>
                            </div>
                            <div class="example-item">
                                <span class="example-number">#1</span>
                                <div class="example-jp">
                                    <span class="example-jp-text">${word.example_jp}</span>
                                    <button class="jp-audio-btn" onclick="speakText('${cleanJp}')" aria-label="Play audio">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                                    </button>
                                </div>
                                <div class="example-en">${exEn}</div>
                                ${exNe ? `<div class="example-ne">${exNe}</div>` : ''}
                            </div>
                        </div>
                    `;
                }

                const prevWord = currentIndex > 0 ? allWordsData[currentIndex - 1] : null;
                const nextWord = currentIndex < allWordsData.length - 1 ? allWordsData[currentIndex + 1] : null;

                container.innerHTML = `
                    <div class="vocab-header">
                        <div class="eyebrow">
                            <span class="dot"></span>
                            No. ${String(currentIndex + 1).padStart(3, '0')}
                            <span class="divider"></span>
                        </div>
                        <h2 class="vocab-word">${word.word}</h2>
                        <p class="vocab-reading">${word.romaji || ''}</p>
                        <div class="vocab-meta">
                            <div class="meta-chip"><span class="label">Type</span><span class="value">${word.type || 'Word'}</span></div>
                            <div class="meta-chip"><span class="label">JLPT</span><span class="value">${level.toUpperCase()}</span></div>
                        </div>
                    </div>

                    <div class="content-scroll">
                        <div class="info-section">
                            <div class="section-header">
                                <span class="section-num">01</span>
                                <h2 class="section-title">Meaning</h2>
                                <span class="section-line"></span>
                            </div>
                            <div class="section-card">
                                <div class="meaning-text">${word.meaning_en || ''}</div>
                                ${word.meaning_ne ? `<div class="meaning-np">${word.meaning_ne}</div>` : ''}
                            </div>
                        </div>
                        ${exampleHTML}
                    </div>
                `;

                document.getElementById('nav-buttons').style.display = 'grid';
                
                if (prevWord) {
                    document.getElementById('prev-title').textContent = prevWord.word;
                    document.getElementById('prev-btn').disabled = false;
                } else {
                    document.getElementById('prev-btn').disabled = true;
                }
                
                if (nextWord) {
                    document.getElementById('next-title').textContent = nextWord.word;
                    document.getElementById('next-btn').disabled = false;
                } else {
                    document.getElementById('next-btn').disabled = true;
                }

            } catch (e) {
                container.innerHTML = `<div class="loading" style="color: var(--accent-error)">Error loading vocab_${level}.json</div>`;
                console.error(e);
            }
        }

        function goToPrevWord() {
            if (currentIndex > 0) {
                const prevWordItem = allWordsData[currentIndex - 1];
                currentWordId = prevWordItem.id;
                
                // Update URL cleanly without piling up browser history stack
                const newUrl = `vocab-detail.html?id=${currentWordId}&level=${level}`;
                window.history.replaceState({ id: currentWordId }, '', newUrl);
                
                // Re-render instantly and scroll to top
                loadVocabDetail();
                window.scrollTo(0, 0);
            }
        }

        function goToNextWord() {
            if (currentIndex < allWordsData.length - 1) {
                const nextWordItem = allWordsData[currentIndex + 1];
                currentWordId = nextWordItem.id;
                
                // Update URL cleanly without piling up browser history stack
                const newUrl = `vocab-detail.html?id=${currentWordId}&level=${level}`;
                window.history.replaceState({ id: currentWordId }, '', newUrl);
                
                // Re-render instantly and scroll to top
                loadVocabDetail();
                window.scrollTo(0, 0);
            }
        }

        loadVocabDetail();
    </script>
</body>
</html>
