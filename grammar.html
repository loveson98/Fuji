<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#09090B">
    <title>Grammar - Fuji Learn</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=17.0">
    <script>
        (function() {
            const saved = localStorage.getItem('fuji_theme');
            const theme = saved ? JSON.parse(saved) : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        .sub-header { position: relative !important; top: auto !important; display: flex; align-items: center; justify-content: space-between; padding: var(--space-md) var(--space-lg); padding-top: calc(var(--space-md) + var(--safe-top)); background: var(--bg-primary); border-bottom: 1px solid var(--border-subtle); }
        .sub-header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.02em; flex: 1; text-align: center; margin: 0; }
        .back-btn { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; color: var(--text-primary); transition: background 0.2s ease; text-decoration: none; cursor: pointer; border: none; background: none; }
        .back-btn:active { background: var(--bg-tertiary); }
        .header-spacer { width: 40px; }
        .app-main { padding: 0 16px calc(var(--space-lg) + var(--safe-bottom)) 16px; }

        .segmented-control { display: flex; background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-full); padding: 4px; margin: 20px 0; }
        .seg-btn { flex: 1; padding: 10px 0; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); border: none; background: none; cursor: pointer; transition: all 0.2s ease; }
        .seg-btn.active { background: var(--bg-tertiary); color: var(--text-primary); box-shadow: var(--shadow-sm); }

        .grammar-list { display: flex; flex-direction: column; gap: 12px; }
        .grammar-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
            touch-action: manipulation;
        }
        .grammar-card:active { transform: scale(0.98); border-color: var(--accent-primary); }
        .grammar-title { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; font-family: var(--font-jp); }
        .grammar-meaning { font-size: 0.85rem; color: var(--text-secondary); }
        .grammar-arrow { color: var(--text-tertiary); }
        .loading { text-align: center; padding: 40px; color: var(--text-tertiary); }
    </style>
</head>
<body>
    <div class="app-container animate-fade-in">
        <header class="sub-header">
            <button class="back-btn" onclick="window.history.back()"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg></button>
            <h1>Grammar</h1>
            <div class="header-spacer"></div>
        </header>

        <main class="app-main">
            <div class="segmented-control">
                <button class="seg-btn active" onclick="switchLevel('n5', this)">N5</button>
                <button class="seg-btn" onclick="switchLevel('n4', this)">N4</button>
            </div>
            <div id="grammar-list" class="grammar-list"><div class="loading">Loading grammar...</div></div>
        </main>
    </div>
    <script src="app.js?v=17.0"></script>
    <script>
        let currentLevel = 'n5';

        async function loadGrammar() {
            const list = document.getElementById('grammar-list');
            list.innerHTML = '<div class="loading">Loading...</div>';
            try {
                const res = await fetch(`grammar_${currentLevel}.json?v=17.0`);
                const data = await res.json();
                list.innerHTML = '';
                data.forEach(g => {
                    // FIX: Check for both 'grammar' (N4) and 'title' (N5) fields
                    const title = g.grammar || g.title || 'Unknown';
                    const meaning = g.meaning_ne ? `${g.meaning} • ${g.meaning_ne}` : g.meaning;
                    const card = document.createElement('a');
                    card.href = `grammar-detail.html?id=${g.id}&level=${currentLevel}`;
                    card.className = 'grammar-card';
                    card.innerHTML = `
                        <div>
                            <div class="grammar-title">${title}</div>
                            <div class="grammar-meaning">${meaning}</div>
                        </div>
                        <svg class="grammar-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    `;
                    list.appendChild(card);
                });
            } catch (e) { list.innerHTML = '<div class="loading" style="color: var(--accent-error)">Error loading data.</div>'; }
        }

        function switchLevel(level, btn) {
            currentLevel = level;
            document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadGrammar();
        }

        loadGrammar();
    </script>
</body>
</html>
